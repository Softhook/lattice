<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emberwake</title>
<style>
  /*
   * The DOM half of the art direction. `@latticekit/ui` ships no stylesheet — it writes
   * structure, `pointer-events` and the `--lattice-*` custom properties `hud.ts` pushes from the
   * live palette — so everything below is this game's own, exactly as `art/*.ts` is for the
   * canvas half.
   *
   * There is no splash, no sign-in and no modal here on purpose. The only overlay that ever
   * covers the world is the end card, and it appears once, at the end.
   */
  html, body {
    margin: 0; height: 100%; background: #05070f; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; }

  .lattice-ui {
    --paper: #f6efe4;
    --dim: #9aa6bd;
    --ember: #ff8a3c;
    --plate: rgba(9, 13, 26, .74);
    --edge: rgba(246, 239, 228, .14);
    font: 600 13px/1.35 ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
  }

  .dock { position: absolute; display: flex; gap: 9px; }
  /* A plate under the top-left block. Without one the title and the brief sit straight on the
     world, and the world under them is sometimes a burning island — measured at contrast 1.04
     against a floor of 3 by tools/looking. The plate is a gradient rather than a box so it has
     no edge to notice, and it is `pointer-events: none` because it is scenery. */
  .dock-tl::before {
    content: ''; position: absolute; left: -18px; top: -16px; right: -34px; bottom: -18px;
    background: linear-gradient(105deg, rgba(4, 7, 15, .88) 42%, rgba(4, 7, 15, 0));
    pointer-events: none;
  }
  .dock-tl > * { position: relative; }
  .dock-tl { left: 16px; top: 14px; flex-direction: column; align-items: flex-start; }
  .dock-tr { right: 16px; top: 14px; flex-direction: column; align-items: flex-end; }

  .title { font-size: 11px; font-weight: 800; letter-spacing: .34em; color: var(--ember); margin: 0; }
  /* The one line of text that names the next action. It is the whole tutorial. */
  .brief { margin: 0; font-size: 13px; color: var(--paper); max-width: 46ch; }
  .keys { margin: 0; font-size: 11px; letter-spacing: .1em; color: var(--dim); }

  .gauge { display: flex; align-items: center; gap: 9px; }
  .gauge-label { font-size: 10px; letter-spacing: .2em; color: var(--dim); }
  .bar { width: 148px; height: 9px; background: rgba(0, 0, 0, .55); border: 1px solid var(--edge); }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--ember); transition: width .12s linear; }
  .bar.hull > i { background: linear-gradient(90deg, #d1483f, #ffb347); }

  .tally { font-size: 22px; font-weight: 800; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .tally small { font-size: 10px; letter-spacing: .2em; color: var(--dim); font-weight: 700; }
  .perf { font-size: 9px; letter-spacing: .16em; color: var(--dim); font-variant-numeric: tabular-nums; }

  .mute {
    font: inherit; font-size: 10px; letter-spacing: .18em; padding: 5px 10px; cursor: pointer;
    background: var(--plate); color: var(--dim); border: 1px solid var(--edge);
  }
  .mute[data-on='1'] { color: var(--paper); }
  .mute:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

  /* The end card. The only thing in this game that ever covers the world, and it means the run
     is over — so it is allowed to be a plate and is not allowed to appear before then. */
  .card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 26px 34px; min-width: 330px; text-align: center;
    background: var(--plate); border: 1px solid var(--edge);
    backdrop-filter: blur(3px);
    animation: rise 320ms cubic-bezier(.16, 1, .3, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -44%); } }
  .card h2 { margin: 0 0 4px; font-size: 26px; letter-spacing: .1em; }
  .card .won { color: var(--ember); }
  .card .lost { color: #d1483f; }
  .card p { margin: 0 0 14px; font-size: 12px; color: var(--dim); letter-spacing: .06em; }
  .card button {
    font: inherit; font-size: 12px; letter-spacing: .18em; padding: 10px 22px; cursor: pointer;
    background: var(--ember); color: #10131f; border: 0; font-weight: 800;
  }
  .card button:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  @media (max-width: 640px) {
    .brief { font-size: 12px; max-width: 30ch; }
    .bar { width: 96px; }
  }
</style>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
