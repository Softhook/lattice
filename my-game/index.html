<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdant — Living World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: #060d05;
        color: #d2e8bf;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #top-bar {
        position: absolute;
        top: 12px;
        right: 14px;
        z-index: 100;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .top-btn {
        background: rgba(13, 27, 10, 0.85);
        color: #d2e8bf;
        border: 1px solid #2d4525;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      }
      .top-btn:hover {
        background: rgba(28, 54, 22, 0.95);
        color: #ffffff;
        border-color: #4f803f;
        transform: translateY(-1px);
      }
      .top-btn:active {
        transform: translateY(1px);
      }
      .top-btn.btn-accent {
        background: rgba(20, 60, 35, 0.85);
        border-color: #27ae60;
        color: #7eed9e;
      }
      .top-btn.btn-accent:hover {
        background: rgba(25, 90, 50, 0.95);
        color: #ffffff;
      }
      #app {
        position: relative;
        flex: 1;
        min-height: 0;
        width: 100%;
        height: 100%;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: #091207;
        border-top: 2px solid #1c2b17;
        padding: 8px 16px;
        flex-shrink: 0;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }
      #controls.hidden {
        display: none;
      }
      .player-legend {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
      }
      .player-badge {
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .p1-badge { background: #1c425c; color: #7ec4f8; border: 1px solid #2980b9; }
      .p2-badge { background: #542b10; color: #f8a872; border: 1px solid #d35400; }
      .tool-tag {
        background: #1e3318;
        color: #f1c40f;
        border: 1px solid #325725;
        padding: 2px 8px;
        border-radius: 3px;
        font-weight: 700;
        font-size: 11px;
      }
      .keys-group {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        opacity: 0.85;
      }
      kbd {
        background: #152412;
        border: 1px solid #2d4525;
        box-shadow: 0 1px 0 rgba(0,0,0,0.5);
        border-radius: 3px;
        padding: 2px 5px;
        font-size: 10px;
        font-weight: bold;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e4f0d8;
      }
    </style>
  </head>
  <body>
    <div id="top-bar">
      <button id="btn-new-world" class="top-btn" title="Generate a fresh new world with a new seed (F2)">
        <span>↺</span> New World
      </button>
      <button id="btn-fullscreen" class="top-btn btn-accent" title="Toggle Fullscreen Mode (F11)">
        <span>⛶</span> Fullscreen
      </button>
      <button id="btn-controls-toggle" class="top-btn" title="Toggle Controls Bar (H)">
        <span>⌨</span> Controls
      </button>
    </div>
    <div id="app">
      <canvas id="viewport"></canvas>
    </div>
    <div id="controls">
      <div class="player-legend">
        <span class="player-badge p1-badge">Player 1</span>
        <span class="tool-tag"><span id="p1-tool">MOVE</span></span>
        <div class="keys-group">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span><kbd>Space</kbd> Attack</span>
          <span><kbd>C</kbd> Swap</span>
          <span><kbd>V</kbd> Craft</span>
          <span><kbd>E</kbd> Build</span>
          <span><kbd>F</kbd> Mode</span>
          <span><kbd>Q</kbd>/<kbd>R</kbd> Dig/Raise</span>
        </div>
      </div>
      <div class="player-legend">
        <span class="player-badge p2-badge">Player 2</span>
        <span class="tool-tag"><span id="p2-tool">MOVE</span></span>
        <div class="keys-group">
          <span><kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd></span>
          <span><kbd>N</kbd> Attack</span>
          <span><kbd>,</kbd> Swap</span>
          <span><kbd>.</kbd> Craft</span>
          <span><kbd>O</kbd> Build</span>
          <span><kbd>H</kbd> Mode</span>
          <span><kbd>U</kbd>/<kbd>Y</kbd> Dig/Raise</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
