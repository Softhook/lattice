<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdant — Living World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: #060d05;
        color: #d2e8bf;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100%;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #app {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: #091207;
        border-top: 2px solid #1c2b17;
        padding: 8px 16px;
        flex-shrink: 0;
      }
      .player-legend {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12px;
      }
      .player-badge {
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
      }
      .p1-badge { background: #1c425c; color: #7ec4f8; border: 1px solid #2980b9; }
      .p2-badge { background: #542b10; color: #f8a872; border: 1px solid #d35400; }
      .tool-tag {
        background: #1e3318;
        color: #f1c40f;
        border: 1px solid #325725;
        padding: 2px 8px;
        border-radius: 3px;
        font-weight: 700;
        font-size: 11px;
      }
      .keys-group {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        opacity: 0.85;
      }
      kbd {
        background: #152412;
        border: 1px solid #2d4525;
        box-shadow: 0 1px 0 rgba(0,0,0,0.5);
        border-radius: 3px;
        padding: 2px 5px;
        font-size: 10px;
        font-weight: bold;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e4f0d8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
    </div>
    <div id="controls">
      <div class="player-legend">
        <span class="player-badge p1-badge">Player 1</span>
        <span class="tool-tag"><span id="p1-tool">MOVE</span></span>
        <div class="keys-group">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
          <span><kbd>E</kbd> Harvest / Build</span>
          <span><kbd>F</kbd> Mode</span>
          <span><kbd>Q</kbd> Dig</span>
          <span><kbd>R</kbd> Raise</span>
        </div>
      </div>
      <div class="player-legend">
        <span class="player-badge p2-badge">Player 2</span>
        <span class="tool-tag"><span id="p2-tool">MOVE</span></span>
        <div class="keys-group">
          <span><kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd> Move</span>
          <span><kbd>O</kbd> Harvest / Build</span>
          <span><kbd>H</kbd> Mode</span>
          <span><kbd>U</kbd> Dig</span>
          <span><kbd>Y</kbd> Raise</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
